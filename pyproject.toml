[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-mcp-tools"
version = "0.1.0"
description = "Standalone KiCad automation toolkit extracted from MycoMIDI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "rjmendez" }]
keywords = ["kicad", "automation", "sexpr", "drc", "footprint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["mcp>=2.0.0,<3.0.0"]

[project.scripts]
mcp-server-kicad-tools = "kicad_mcp_tools.mcp_server:main"

[tool.setuptools]
packages = ["kicad_mcp_tools"]
